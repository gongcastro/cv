abstract: |
    **Post-doctoral researcher**, *Institut de Recerca Sant Joan de Déu*.
    
    I am a cognitive scientist interested in the application of Bayesian modelling in the investigation of early language acquisition and its evolutionary roots. I am currently working as a post-doctoral researcher at the Institut de Rercerca Sant Joan de Déu (Barcelona, Spain), where I use brain imaging (fNIRS), behavioural, and computational techniques to study how newborns, infants, and non-human animals (Long-Evans rats) perceive and process speech.

